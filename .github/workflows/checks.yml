name: Evaluation checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Keep private experiment artifacts out of Git
        run: python3 tools/check_repository.py
      - name: Regression tests without models or private data
        run: npm test
      - name: Python and JavaScript syntax
        run: |
          python3 -m compileall -q prototypes tests tools
          for file in prototypes/model-evaluation/*.mjs tests/*.mjs; do
            node --check "$file"
          done
